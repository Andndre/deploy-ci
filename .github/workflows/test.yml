name: Test generator and safe deployment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Check deployment shell
        if: runner.os == 'Linux'
        run: |
          bash -n bin/remote-deploy.sh
          shellcheck bin/remote-deploy.sh
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Check generated workflows
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:latest -shellcheck= -pyflakes= .github/workflows/test.yml .test-output/generated-workflows/*.yml
      - name: Test generator on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        env:
          POWERSHELL_EXE: powershell
        run: uv run --frozen python -m unittest discover -s tests -p test_generator.py -v
